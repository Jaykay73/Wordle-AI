# Hybrid Neuro-Symbolic Solver Weights & Config
scoring:
  alpha: 0.5   # Weight for Transformer neural score P(word | state)
  beta: 0.4    # Weight for Information-theoretic Entropy gain H(F|g)
  gamma: 0.1   # Weight for Letter frequency score

constraints:
  enforce_strict: true # Symbolic hard constraint filter (eliminates invalid words before ranking)
